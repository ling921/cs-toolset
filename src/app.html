<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0d7668" />
    <link rel="icon" type="image/svg+xml" href="/cs-toolset-mark.svg" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <script>
      try {
        const p = JSON.parse(localStorage.getItem('cs-toolset:preferences:v1') || '{}');
        document.documentElement.dataset.theme =
          p.theme === 'dark' ||
          (p.theme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
            ? 'dark'
            : 'light';
      } catch {}
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
