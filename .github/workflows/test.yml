name: test

on:
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      site_url:
        description: Site origin used for generated canonical URLs and the sitemap
        required: false
        default: https://example.com
        type: string

permissions:
  contents: read

concurrency:
  group: test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check, lint and unit test
        run: |
          npm run check
          npm run lint
          npm test

      - name: Build and verify static output
        run: |
          npm run build
          npm run verify:build
        env:
          SITE_URL: ${{ inputs.site_url || vars.SITE_URL || 'https://example.com' }}
          DEPLOY_CONTEXT: preview

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run browser tests
        run: npm run test:e2e
